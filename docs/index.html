<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Copier Inventory</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <style>
    thead th { position: sticky; top: 0; z-index: 10; }
    th.sortable { cursor: pointer; user-select: none; white-space: nowrap; }
    th.sortable::after { content: " ↕"; opacity: 0.4; font-size: 0.7em; }
    th.asc::after  { content: " ↑"; opacity: 1; }
    th.desc::after { content: " ↓"; opacity: 1; }
    tbody tr:hover { background-color: #eff6ff !important; }
    #table-wrap { max-height: calc(100vh - 260px); overflow-y: auto; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { animation: spin 1s linear infinite; }
    #drop-zone.drag-over { border-color: #3b82f6; background: #eff6ff; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

<!-- ── Header ─────────────────────────────────────────────────────────── -->
<header class="bg-blue-900 text-white px-6 py-4 flex flex-wrap items-center justify-between gap-3">
  <div>
    <h1 class="text-2xl font-bold tracking-tight">Copier Inventory</h1>
    <p id="meta" class="text-blue-200 text-sm mt-0.5">Loading…</p>
  </div>
  <div class="flex items-center gap-2 flex-wrap">
    <button onclick="openUploadModal()"
      class="bg-emerald-500 hover:bg-emerald-400 text-white font-semibold text-sm px-4 py-2 rounded shadow transition">
      ↑ Uploads
    </button>
    <button id="btn-refresh" onclick="triggerRefresh()"
      class="bg-amber-400 hover:bg-amber-300 text-gray-900 font-semibold text-sm px-4 py-2 rounded shadow transition">
      ↻ Refresh Data
    </button>
    <button id="btn-csv" onclick="downloadCSV()" disabled
      class="bg-white text-blue-900 font-semibold text-sm px-4 py-2 rounded shadow hover:bg-blue-50 transition disabled:opacity-40">
      ⬇ Download CSV
    </button>
  </div>
</header>

<!-- ── Filters ─────────────────────────────────────────────────────────── -->
<div class="bg-white border-b border-gray-200 px-6 py-3 flex flex-wrap gap-3 items-center">
  <input id="search" type="text" placeholder="🔍  Search brand, model, description…"
    oninput="applyFilters()"
    class="flex-1 min-w-52 border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400" />
  <select id="f-source" onchange="applyFilters()"
    class="border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400 bg-white">
    <option value="">All Sources</option>
  </select>
  <select id="f-brand" onchange="applyFilters()"
    class="border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400 bg-white">
    <option value="">All Brands</option>
  </select>
  <select id="f-condition" onchange="applyFilters()"
    class="border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400 bg-white">
    <option value="">All Conditions</option>
  </select>
  <button onclick="clearFilters()" class="text-sm text-gray-500 hover:text-gray-800 underline">Clear</button>
</div>

<!-- ── Manual source banner ────────────────────────────────────────────── -->
<div id="manual-banner" class="hidden bg-emerald-50 border-b border-emerald-200 px-6 py-2 flex flex-wrap gap-2 items-center text-xs">
  <span class="font-semibold text-emerald-700 mr-1">Manual sources:</span>
</div>

<!-- ── Status bar ──────────────────────────────────────────────────────── -->
<div class="px-6 py-2 text-sm text-gray-500 flex items-center gap-2">
  <span id="count-label">—</span>
  <span id="spinner" class="inline-block w-4 h-4 border-2 border-blue-500 border-t-transparent rounded-full spinner hidden"></span>
</div>

<!-- ── Table ───────────────────────────────────────────────────────────── -->
<div id="table-wrap" class="px-6 pb-6">
  <table class="w-full text-sm border-collapse bg-white shadow rounded-lg overflow-hidden">
    <thead class="bg-blue-900 text-white text-xs uppercase tracking-wide">
      <tr>
        <th class="sortable px-4 py-3 text-left"  data-col="source">Source</th>
        <th class="sortable px-4 py-3 text-left"  data-col="brand">Brand</th>
        <th class="sortable px-4 py-3 text-left"  data-col="model">Model</th>
        <th class="sortable px-4 py-3 text-left"  data-col="condition">Cond.</th>
        <th class="sortable px-4 py-3 text-right" data-col="meter">Meter</th>
        <th class="sortable px-4 py-3 text-right" data-col="qty">Qty</th>
        <th class="sortable px-4 py-3 text-right" data-col="price">Price</th>
        <th class="px-4 py-3 text-left">Description</th>
        <th class="px-4 py-3 text-left">Notes</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <div id="empty-msg" class="hidden text-center text-gray-400 py-16 text-lg">
    No machines match your filters.
  </div>
</div>


<!-- ═══════════════════════════════════════════════════════════════════════
     MODAL: Uploads / Manage
════════════════════════════════════════════════════════════════════════ -->
<div id="modal-upload" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-xl shadow-2xl w-full max-w-xl p-6 max-h-[90vh] overflow-y-auto">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-lg font-bold text-gray-900">Manual Inventory Files</h2>
      <button onclick="closeUploadModal()" class="text-gray-400 hover:text-gray-600 text-xl leading-none">✕</button>
    </div>

    <!-- Current uploads -->
    <div id="current-uploads-section">
      <h3 class="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">Current uploads</h3>
      <div id="current-uploads-list" class="space-y-2 mb-5">
        <p class="text-sm text-gray-400 italic">Loading…</p>
      </div>
      <hr class="border-gray-200 mb-5" />
    </div>

    <!-- Upload new file -->
    <h3 class="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-3">Add new file</h3>

    <div id="drop-zone"
      class="border-2 border-dashed border-gray-300 rounded-lg p-6 text-center cursor-pointer hover:border-blue-400 transition mb-4"
      onclick="document.getElementById('file-input').click()"
      ondragover="onDragOver(event)" ondragleave="onDragLeave(event)" ondrop="onDrop(event)">
      <div id="drop-label">
        <p class="text-gray-500 font-medium">Drop file here or <span class="text-blue-600 underline">browse</span></p>
        <p class="text-xs text-gray-400 mt-1">Accepts .csv, .xlsx, .xls</p>
      </div>
      <div id="drop-chosen" class="hidden">
        <p class="text-blue-700 font-semibold" id="chosen-name"></p>
        <p class="text-xs text-gray-400 mt-1" id="chosen-size"></p>
      </div>
    </div>
    <input id="file-input" type="file" accept=".csv,.xlsx,.xls" class="hidden" onchange="onFileChosen(event)" />

    <div class="mb-4">
      <label class="block text-xs font-semibold text-gray-600 mb-1">Source</label>
      <select id="upload-source" onchange="onSourceChange()"
        class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400 bg-white">
        <option value="TNT Copiers">TNT Copiers</option>
        <option value="Wulff Enterprises">Wulff Enterprises</option>
        <option value="Mars">Mars</option>
        <option value="Impact Networking">Impact Networking</option>
        <option value="Intercom Group">Intercom Group</option>
        <option value="Other">Other…</option>
      </select>
      <input id="upload-source-custom" type="text" placeholder="Enter source name"
        class="hidden w-full border border-gray-300 rounded px-3 py-2 text-sm mt-2 focus:outline-none focus:ring-2 focus:ring-blue-400" />
    </div>

    <!-- Progress steps -->
    <div id="upload-steps" class="hidden mb-4 space-y-1 text-xs text-gray-500">
      <div id="step-parse">⬜ Parsing file…</div>
      <div id="step-save">⬜ Saving to server…</div>
      <div id="step-done">⬜ Done</div>
    </div>

    <div id="upload-status" class="hidden text-sm rounded px-3 py-2 mb-4"></div>

    <div class="flex justify-end">
      <button id="btn-do-upload" onclick="doUpload()" disabled
        class="px-4 py-2 text-sm font-semibold bg-emerald-600 text-white rounded hover:bg-emerald-700 disabled:opacity-40 disabled:cursor-not-allowed">
        Upload & Save
      </button>
    </div>
  </div>
</div>


<!-- ═══════════════════════════════════════════════════════════════════════
     JavaScript
════════════════════════════════════════════════════════════════════════ -->
<script>
// ── Data state ──────────────────────────────────────────────────────────────
let allRecords = [];
let filtered   = [];
let sortCol    = "source";
let sortDir    = 1;

// ── Client-side column normalizer ───────────────────────────────────────────
const COL_MAP = {
  "make":"brand","manufacturer":"brand","mfr":"brand","mfg":"brand","oem":"brand",
  "model":"model","model #":"model","model#":"model","model number":"model",
  "item":"model","product":"model","machine":"model","unit":"model","equipment":"model","name":"model",
  "serial":"serial","serial_#":"serial","serial #":"serial","serial number":"serial",
  "serialnumber":"serial","s/n":"serial","sn":"serial",
  "condition":"condition","cond":"condition","grade":"condition","quality":"condition",
  "qty":"qty","quantity":"qty","stock":"qty","available":"qty","count":"qty","units":"qty",
  "price":"price","cost":"price","sell price":"price","list price":"price","asking":"price","amount":"price",
  "meter":"meter","total_meter":"meter","total meter":"meter","bw_meter":"meter","bw meter":"meter",
  "description":"description","accessories":"description",
  "notes":"notes","comments":"notes","comment":"notes","remarks":"notes",
};

const BRAND_MAP = {
  "canon":"Canon","can":"Canon","cnon":"Canon","cnn":"Canon",
  "ricoh":"Ricoh","ric":"Ricoh","rico":"Ricoh",
  "kyocera":"Kyocera","kyo":"Kyocera","kyocera-mita":"Kyocera","kyoceramita":"Kyocera",
  "konica minolta":"Konica Minolta","konica":"Konica Minolta","minolta":"Konica Minolta","konicaminolta":"Konica Minolta","km":"Konica Minolta",
  "xerox":"Xerox","xrx":"Xerox","xer":"Xerox",
  "toshiba":"Toshiba","tos":"Toshiba","tosh":"Toshiba",
  "sharp":"Sharp","sha":"Sharp","shp":"Sharp",
  "hp":"HP","hewlett":"HP","hewlett-packard":"HP",
  "lexmark":"Lexmark","lex":"Lexmark",
  "samsung":"Samsung","sam":"Samsung",
  "brother":"Brother","bro":"Brother",
  "epson":"Epson","eps":"Epson",
  "savin":"Savin","sav":"Savin",
  "lanier":"Lanier","lan":"Lanier",
  "gestetner":"Gestetner","ges":"Gestetner",
  "copystar":"Copystar","cpy":"Copystar",
  "develop":"Develop","oce":"OCE",
  "muratec":"Muratec","mur":"Muratec",
  "panasonic":"Panasonic","pan":"Panasonic",
  "pitney bowes":"Pitney Bowes","pitney":"Pitney Bowes",
};

function resolveBrand(raw) {
  if (!raw) return "";
  const s = String(raw).toLowerCase().trim();
  if (BRAND_MAP[s]) return BRAND_MAP[s];
  const keys = Object.keys(BRAND_MAP).sort((a, b) => b.length - a.length);
  for (const k of keys) {
    const re = new RegExp("\\b" + k.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\b");
    if (re.test(s)) return BRAND_MAP[k];
  }
  return String(raw).trim();
}

function normalizeRow(rawRow, sourceName) {
  const out = { source: sourceName, brand: "", model: "", condition: "", meter: 0, qty: 1, price: 0, description: "", notes: "", serial: "" };
  for (const [k, v] of Object.entries(rawRow)) {
    const col = COL_MAP[String(k).toLowerCase().trim()] || String(k).toLowerCase().trim();
    if (col in out) out[col] = v ?? "";
  }
  out.brand  = resolveBrand(out.brand || "");
  out.serial = String(out.serial || "").trim().toUpperCase();
  out.qty    = Number(String(out.qty).replace(/[^\d.]/g, "")) || 1;
  out.price  = parseFloat(String(out.price).replace(/[^\d.]/g, "")) || 0;
  out.meter  = parseFloat(String(out.meter).replace(/[^\d.]/g, "")) || 0;
  return out;
}

// ── Bootstrap ───────────────────────────────────────────────────────────────
(async () => {
  showSpinner(true);
  try {
    // Load auto-fetched inventory
    const autoRes = await fetch("data/inventory.json");
    if (!autoRes.ok) throw new Error(`HTTP ${autoRes.status}`);
    const autoData = await autoRes.json();
    let records = autoData.records || [];

    const updated = autoData.updated
      ? new Date(autoData.updated).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" })
      : "unknown";
    document.getElementById("meta").textContent =
      `${autoData.total.toLocaleString()} machines from wholesalers · Updated ${updated}`;

    // Load manual sources and merge
    const manualRecords = await fetchManualRecords();
    const manualSources = new Set(manualRecords.map(r => r.source));
    records = records.filter(r => !manualSources.has(r.source)).concat(manualRecords);

    allRecords = records;
    rebuildDropdowns();
    refreshManualBanner();
    applyFilters();
    document.getElementById("btn-csv").disabled = false;
  } catch (err) {
    document.getElementById("meta").textContent = "Error loading inventory.";
    document.getElementById("count-label").textContent = err.message;
  } finally {
    showSpinner(false);
  }
})();

async function fetchManualRecords() {
  try {
    // Read directly from GitHub Pages (already served as static file)
    const res = await fetch(`data/manual_sources.json?_=${Date.now()}`);
    if (!res.ok) return [];
    const data = await res.json();
    const records = [];
    for (const [, entry] of Object.entries(data.sources || {})) {
      if (entry.records?.length) records.push(...entry.records);
    }
    return records;
  } catch (_) {
    return [];
  }
}

function refreshManualBanner() {
  fetch(`data/manual_sources.json?_=${Date.now()}`)
    .then(r => r.ok ? r.json() : { sources: {} })
    .then(data => {
      const banner = document.getElementById("manual-banner");
      const entries = Object.entries(data.sources || {});
      if (!entries.length) { banner.classList.add("hidden"); return; }

      banner.classList.remove("hidden");
      const label = `<span class="font-semibold text-emerald-700 mr-1">Manual sources:</span>`;
      const chips = entries.map(([source, entry]) => {
        const date = new Date(entry.uploadedAt).toLocaleDateString();
        const safe = source.replace(/'/g, "\\'");
        return `<span class="inline-flex items-center gap-1 bg-white border border-emerald-300 text-emerald-800 px-2 py-1 rounded">
          📄 <strong>${esc(source)}</strong>: ${entry.records?.length ?? 0} machines · ${esc(entry.filename)} · ${date}
          <button onclick="removeManualSource('${safe}')" class="ml-1 text-red-400 hover:text-red-600 font-bold" title="Remove">×</button>
        </span>`;
      }).join("");
      banner.innerHTML = label + chips;
    })
    .catch(() => {});
}

async function removeManualSource(sourceName) {
  if (!confirm(`Remove all ${sourceName} machines from the inventory?`)) return;
  try {
    const r = await fetch("/api/manual", {
      method: "DELETE",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ source: sourceName }),
    });
    if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.error || r.status); }
    allRecords = allRecords.filter(r => r.source !== sourceName);
    rebuildDropdowns();
    applyFilters();
    refreshManualBanner();
  } catch (err) {
    alert("Error removing source: " + err.message);
  }
}

// ── Filter + sort ───────────────────────────────────────────────────────────
function applyFilters() {
  const q     = document.getElementById("search").value.trim().toLowerCase();
  const src   = document.getElementById("f-source").value;
  const brand = document.getElementById("f-brand").value;
  const cond  = document.getElementById("f-condition").value;

  filtered = allRecords.filter(r => {
    if (src   && r.source    !== src)   return false;
    if (brand && r.brand     !== brand) return false;
    if (cond  && r.condition !== cond)  return false;
    if (q) {
      const hay = [r.brand, r.model, r.description, r.notes, r.source].join(" ").toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  sortAndRender();
}

function sortAndRender() {
  filtered.sort((a, b) => {
    const av = a[sortCol] ?? "", bv = b[sortCol] ?? "";
    if (typeof av === "number" && typeof bv === "number") return (av - bv) * sortDir;
    return String(av).localeCompare(String(bv)) * sortDir;
  });
  render();
}

function render() {
  const tbody = document.getElementById("tbody");
  const empty = document.getElementById("empty-msg");
  document.getElementById("count-label").textContent =
    `Showing ${filtered.length.toLocaleString()} of ${allRecords.length.toLocaleString()} machines`;

  if (!filtered.length) { tbody.innerHTML = ""; empty.classList.remove("hidden"); return; }
  empty.classList.add("hidden");

  const STRIPE = ["bg-white", "bg-gray-50"];
  let html = "";
  const limit = Math.min(filtered.length, 2000);
  for (let i = 0; i < limit; i++) {
    const r = filtered[i];
    const price = r.price ? `$${Number(r.price).toLocaleString()}` : "—";
    html += `<tr class="${STRIPE[i % 2]}">
      <td class="px-4 py-2 whitespace-nowrap text-blue-700 font-medium">${esc(r.source)}</td>
      <td class="px-4 py-2 whitespace-nowrap font-semibold">${esc(r.brand)}</td>
      <td class="px-4 py-2">${esc(r.model)}</td>
      <td class="px-4 py-2 whitespace-nowrap">${condBadge(r.condition)}</td>
      <td class="px-4 py-2 text-right whitespace-nowrap">${fmtMeter(r.meter)}</td>
      <td class="px-4 py-2 text-right">${Number(r.qty) || 1}</td>
      <td class="px-4 py-2 text-right whitespace-nowrap">${price}</td>
      <td class="px-4 py-2 text-gray-600 max-w-xs truncate" title="${esc(r.description)}">${esc(r.description)}</td>
      <td class="px-4 py-2 text-gray-500 max-w-xs truncate" title="${esc(r.notes)}">${esc(r.notes)}</td>
    </tr>`;
  }
  if (filtered.length > 2000) {
    html += `<tr><td colspan="9" class="text-center text-gray-400 py-4 text-sm">
      Showing first 2,000 of ${filtered.length.toLocaleString()} — refine search to see more.</td></tr>`;
  }
  tbody.innerHTML = html;
}

function fmtMeter(val) {
  const n = Number(val);
  if (!n || isNaN(n)) return '<span class="text-gray-300">—</span>';
  return n.toLocaleString();
}

function condBadge(cond) {
  if (!cond) return '<span class="text-gray-400">—</span>';
  const colors = { Yes: "bg-green-100 text-green-800", Pass: "bg-green-100 text-green-800",
                   No: "bg-red-100 text-red-700", Fail: "bg-red-100 text-red-700" };
  return `<span class="inline-block px-2 py-0.5 rounded text-xs font-medium ${colors[cond] || "bg-gray-100 text-gray-600"}">${esc(cond)}</span>`;
}

function esc(s) {
  return String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

// ── Sort headers ─────────────────────────────────────────────────────────────
document.querySelectorAll("th.sortable").forEach(th => {
  th.addEventListener("click", () => {
    const col = th.dataset.col;
    sortDir = (sortCol === col) ? sortDir * -1 : 1;
    sortCol = col;
    document.querySelectorAll("th.sortable").forEach(t => t.classList.remove("asc", "desc"));
    th.classList.add(sortDir === 1 ? "asc" : "desc");
    sortAndRender();
  });
});

// ── Helpers ──────────────────────────────────────────────────────────────────
function rebuildDropdowns() {
  ["f-source", "f-brand", "f-condition"].forEach(id => {
    const sel = document.getElementById(id);
    const cur = sel.value;
    while (sel.options.length > 1) sel.remove(1);
    let vals = [];
    if (id === "f-source")    vals = [...new Set(allRecords.map(r => r.source))].sort();
    if (id === "f-brand")     vals = [...new Set(allRecords.map(r => r.brand).filter(Boolean))].sort();
    if (id === "f-condition") vals = [...new Set(allRecords.map(r => r.condition).filter(Boolean))].sort();
    vals.forEach(v => { const o = document.createElement("option"); o.value = o.textContent = v; sel.appendChild(o); });
    if ([...sel.options].some(o => o.value === cur)) sel.value = cur;
  });
}

function clearFilters() {
  document.getElementById("search").value = "";
  ["f-source", "f-brand", "f-condition"].forEach(id => document.getElementById(id).value = "");
  applyFilters();
}

function showSpinner(on) {
  document.getElementById("spinner").classList.toggle("hidden", !on);
}

function downloadCSV() {
  const cols = ["source", "brand", "model", "condition", "meter", "qty", "price", "description", "notes", "serial"];
  const rows = filtered.map(r => cols.map(c => {
    const v = String(r[c] ?? "").replace(/"/g, '""');
    return v.includes(",") || v.includes('"') || v.includes("\n") ? `"${v}"` : v;
  }).join(","));
  const blob = new Blob([cols.join(",") + "\n" + rows.join("\n")], { type: "text/csv" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `copier-inventory-${new Date().toISOString().slice(0, 10)}.csv`;
  a.click();
}

// ════════════════════════════════════════════════════════════════════════════
// REFRESH
// ════════════════════════════════════════════════════════════════════════════
async function triggerRefresh() {
  const btn = document.getElementById("btn-refresh");
  btn.disabled = true;
  showSpinner(true);

  // First reload current data immediately
  try {
    btn.textContent = "Reloading…";
    const [autoRes, manualRecords] = await Promise.all([
      fetch("data/inventory.json?_=" + Date.now()).then(r => r.json()),
      fetchManualRecords(),
    ]);
    const manualSources = new Set(manualRecords.map(r => r.source));
    allRecords = (autoRes.records || []).filter(r => !manualSources.has(r.source)).concat(manualRecords);
    const updated = autoRes.updated
      ? new Date(autoRes.updated).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" })
      : "unknown";
    document.getElementById("meta").textContent =
      `${autoRes.total.toLocaleString()} machines from wholesalers · Updated ${updated}`;
    rebuildDropdowns();
    refreshManualBanner();
    applyFilters();
  } catch (err) {
    console.error("Reload error:", err);
  }

  // Then trigger a fresh scrape via GitHub Actions
  try {
    btn.textContent = "Triggering scrape…";
    const res = await fetch("/api/trigger", { method: "POST" });
    if (res.ok) {
      btn.textContent = "✓ Scrape triggered!";
      btn.classList.add("bg-green-500", "text-white");
      btn.classList.remove("bg-amber-400", "text-gray-900");
      document.getElementById("meta").textContent += " · New scrape running (~2 min)";
    } else {
      const body = await res.json().catch(() => ({}));
      throw new Error(`${res.status}: ${body.message || "unknown"}`);
    }
  } catch (err) {
    btn.textContent = "✓ Reloaded (scrape trigger failed)";
    btn.classList.add("bg-yellow-500", "text-white");
    btn.classList.remove("bg-amber-400", "text-gray-900");
    console.error("Workflow trigger error:", err.message);
  }

  showSpinner(false);
  btn.disabled = false;
  setTimeout(resetRefreshBtn, 5000);
}

function resetRefreshBtn() {
  const btn = document.getElementById("btn-refresh");
  btn.textContent = "↻ Refresh Data";
  btn.className = "bg-amber-400 hover:bg-amber-300 text-gray-900 font-semibold text-sm px-4 py-2 rounded shadow transition";
}

// ════════════════════════════════════════════════════════════════════════════
// FILE UPLOAD
// ════════════════════════════════════════════════════════════════════════════
let chosenFile = null;

function openUploadModal() {
  chosenFile = null;
  document.getElementById("drop-label").classList.remove("hidden");
  document.getElementById("drop-chosen").classList.add("hidden");
  document.getElementById("btn-do-upload").disabled = true;
  document.getElementById("upload-status").classList.add("hidden");
  document.getElementById("upload-steps").classList.add("hidden");
  document.getElementById("file-input").value = "";
  document.getElementById("upload-source-custom").classList.add("hidden");
  document.getElementById("upload-source-custom").value = "";
  document.getElementById("modal-upload").classList.remove("hidden");
  renderCurrentUploads();
}

async function renderCurrentUploads() {
  const list = document.getElementById("current-uploads-list");
  const section = document.getElementById("current-uploads-section");
  list.innerHTML = '<p class="text-sm text-gray-400 italic">Loading…</p>';

  try {
    const res = await fetch(`data/manual_sources.json?_=${Date.now()}`);
    const data = res.ok ? await res.json() : { sources: {} };
    const entries = Object.entries(data.sources || {});

    if (!entries.length) {
      list.innerHTML = '<p class="text-sm text-gray-400 italic">No manual files uploaded yet.</p>';
      return;
    }

    list.innerHTML = entries.map(([source, entry]) => {
      const date = new Date(entry.uploadedAt).toLocaleDateString(undefined, { dateStyle: "medium" });
      const count = entry.records?.length ?? 0;
      const safe  = source.replace(/\\/g, "\\\\").replace(/'/g, "\\'");
      return `
        <div class="flex items-center justify-between gap-4 px-4 py-3 bg-gray-50 border border-gray-200 rounded-lg">
          <div class="min-w-0">
            <p class="text-sm font-semibold text-gray-800 truncate">📄 ${esc(source)}</p>
            <p class="text-xs text-gray-500 truncate">${esc(entry.filename)} &nbsp;·&nbsp; ${count.toLocaleString()} machines &nbsp;·&nbsp; ${date}</p>
          </div>
          <button onclick="removeFromModal('${safe}')"
            class="shrink-0 text-xs font-medium text-red-500 hover:text-white hover:bg-red-500 border border-red-300 hover:border-red-500 px-3 py-1 rounded transition">
            Remove
          </button>
        </div>`;
    }).join("");
  } catch (_) {
    list.innerHTML = '<p class="text-sm text-red-400">Could not load uploads.</p>';
  }
}

async function removeFromModal(sourceName) {
  if (!confirm(`Remove all ${sourceName} machines from the inventory?`)) return;
  try {
    const r = await fetch("/api/manual", {
      method: "DELETE",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ source: sourceName }),
    });
    if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.error || r.status); }
    allRecords = allRecords.filter(r => r.source !== sourceName);
    rebuildDropdowns();
    applyFilters();
    refreshManualBanner();
    renderCurrentUploads();
  } catch (err) {
    alert("Error removing: " + err.message);
  }
}
function closeUploadModal() {
  document.getElementById("modal-upload").classList.add("hidden");
  chosenFile = null;
}

function onSourceChange() {
  const isOther = document.getElementById("upload-source").value === "Other";
  document.getElementById("upload-source-custom").classList.toggle("hidden", !isOther);
}

function onDragOver(e)  { e.preventDefault(); document.getElementById("drop-zone").classList.add("drag-over"); }
function onDragLeave(e) { document.getElementById("drop-zone").classList.remove("drag-over"); }
function onDrop(e) {
  e.preventDefault();
  document.getElementById("drop-zone").classList.remove("drag-over");
  const f = e.dataTransfer.files[0];
  if (f) setChosenFile(f);
}
function onFileChosen(e) { const f = e.target.files[0]; if (f) setChosenFile(f); }

function setChosenFile(file) {
  const ext = file.name.slice(file.name.lastIndexOf(".")).toLowerCase();
  if (![".csv", ".xlsx", ".xls"].includes(ext)) {
    showUploadStatus("Only .csv, .xlsx, .xls files are accepted.", "error");
    return;
  }
  chosenFile = file;
  const base = file.name.toLowerCase();
  const sourceKeys = { tnt: "TNT Copiers", wulff: "Wulff Enterprises", mars: "Mars", impact: "Impact Networking", intercom: "Intercom Group" };
  for (const [key, name] of Object.entries(sourceKeys)) {
    if (base.includes(key)) { document.getElementById("upload-source").value = name; break; }
  }
  document.getElementById("chosen-name").textContent = file.name;
  document.getElementById("chosen-size").textContent = `${(file.size / 1024).toFixed(1)} KB`;
  document.getElementById("drop-label").classList.add("hidden");
  document.getElementById("drop-chosen").classList.remove("hidden");
  document.getElementById("btn-do-upload").disabled = false;
  document.getElementById("upload-status").classList.add("hidden");
}

function setStep(id, state) {
  const el = document.getElementById(id);
  const icons = { pending: "⬜", active: "⏳", done: "✅", error: "❌" };
  const labels = { "step-parse": "Parsing file", "step-save": "Saving to server", "step-done": "Done" };
  el.textContent = `${icons[state] || "⬜"} ${labels[id]}`;
}

async function doUpload() {
  if (!chosenFile) return;
  const btn = document.getElementById("btn-do-upload");
  const sel = document.getElementById("upload-source");
  const sourceName = sel.value === "Other"
    ? document.getElementById("upload-source-custom").value.trim()
    : sel.value;
  if (!sourceName) {
    showUploadStatus("Please enter a source name.", "error");
    return;
  }
  btn.disabled = true;
  document.getElementById("upload-status").classList.add("hidden");
  document.getElementById("upload-steps").classList.remove("hidden");
  setStep("step-parse", "active");
  setStep("step-save",  "pending");
  setStep("step-done",  "pending");

  try {
    // 1. Parse file
    const rawRows = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = e => {
        try {
          const wb = XLSX.read(new Uint8Array(e.target.result), { type: "array" });
          resolve(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: "" }));
        } catch(err) { reject(err); }
      };
      reader.onerror = reject;
      reader.readAsArrayBuffer(chosenFile);
    });

    const records = rawRows
      .map(row => normalizeRow(row, sourceName))
      .filter(r => r.model || r.brand);

    if (!records.length) {
      setStep("step-parse", "error");
      showUploadStatus("No valid rows found. Check that the file has brand or model columns.", "error");
      btn.disabled = false;
      return;
    }
    setStep("step-parse", "done");

    // 2. Save to server via API
    setStep("step-save", "active");
    const saveRes = await fetch("/api/manual", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ source: sourceName, filename: chosenFile.name, records }),
    });
    if (!saveRes.ok) { const e = await saveRes.json().catch(() => ({})); throw new Error(e.error || saveRes.status); }
    setStep("step-save", "done");

    // 3. Update local view immediately (don't wait for GitHub Pages to redeploy)
    allRecords = allRecords.filter(r => r.source !== sourceName).concat(records);
    rebuildDropdowns();
    applyFilters();
    refreshManualBanner();
    renderCurrentUploads();
    setStep("step-done", "done");

    showUploadStatus(
      `✓ ${records.length} machines from "${chosenFile.name}" saved. Data is live for everyone now.`,
      "success"
    );
  } catch (err) {
    setStep("step-save", "error");
    showUploadStatus("Upload failed: " + err.message, "error");
  }

  btn.disabled = false;
}

function showUploadStatus(msg, type) {
  const el = document.getElementById("upload-status");
  const colors = {
    success: "bg-green-50 text-green-800 border border-green-200",
    error:   "bg-red-50 text-red-700 border border-red-200",
    warn:    "bg-yellow-50 text-yellow-800 border border-yellow-200",
  };
  el.className = `text-sm rounded px-3 py-2 mb-4 ${colors[type] || ""}`;
  el.textContent = msg;
  el.classList.remove("hidden");
}

document.getElementById("modal-upload").addEventListener("click", e => {
  if (e.target === e.currentTarget) closeUploadModal();
});
</script>
